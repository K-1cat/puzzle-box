{% extends "base.html" %}

{% block content %}
<h2>Create Text Puzzle</h2>

<form method="POST" enctype="multipart/form-data">
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" placeholder="Chicken Rd" required><br><br>
    
    <label for="content">Content:</label><br>
    <input type="text" id="content" name="content" placeholder="Why did the chicken cross the road?" required><br><br>
    
    <label for="answer">Answer:</label>
    <input type="text" id="answer" name="answer" placeholder="To get to the other side!" required><br><br>

    <button type="submit">Create Puzzle</button>
</form>

<p><a href="{{ url_for('puzzle.create_puzzle') }}">← Back to Puzzle Types</a></p>
{% endblock %}
